services:
  - type: web
    name: polo-oeste-operativa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: polo-oeste-db
          property: connectionString
      - key: ADMIN_INITIAL_USER
        value: Emanuel Machado
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ENABLE_ACTIVITY_MONITOR
        value: "1"

databases:
  - name: polo-oeste-db
    plan: free
    databaseName: polo_oeste
    user: polo_oeste
